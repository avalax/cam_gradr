name: Pages

# Publishes the app on GitHub Pages: the latest release at the root and the preview of every open
# pull request (from the branch pr-previews) under pr-preview/pr-<number>/. It runs after the
# release workflow and after every change of a preview, always from main, because only main may
# deploy to the github-pages environment.
on:
  workflow_run:
    workflows: [Release, PR preview]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Every run publishes the current state, so a newer run may replace a waiting one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Find the latest release
        id: release
        run: echo "tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Add the previews of the open pull requests
        run: |
          if git fetch -q --depth 1 origin pr-previews && git cat-file -e FETCH_HEAD:pr-preview 2> /dev/null; then
            git archive FETCH_HEAD pr-preview | tar -x -C dist
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
