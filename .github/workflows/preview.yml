name: Preview

# Builds the current main for GitHub Pages under main/, and every pull request under pull/<number>/
# (as its address on GitHub), whose build is removed when the pull request is closed. The builds are
# kept on the branch pr-previews; the Pages workflow publishes them next to the released app.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

# A newer push to the same pull request, or to main, replaces the build that is still running.
concurrency:
  group: preview-${{ github.event.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    # Pull requests from forks and Dependabot get no write access, and the release pull request
    # needs no preview.
    if: >-
      github.event_name == 'push' || (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]' &&
        !startsWith(github.head_ref, 'release-please--'))
    runs-on: ubuntu-latest
    env:
      DIR: ${{ github.event_name == 'push' && 'main' || format('pull/{0}', github.event.number) }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        if: github.event.action != 'closed'
      - uses: ./.github/actions/setup
        if: github.event.action != 'closed'
      - run: npm run build
        if: github.event.action != 'closed'
        env:
          BASE_PATH: /${{ github.event.repository.name }}/${{ env.DIR }}/
      - name: Store the build on the branch pr-previews
        env:
          ACTION: ${{ github.event.action }}
        run: |
          # The branch holds one commit with all previews, so that it does not grow with every push.
          # A push that lost the race against another preview starts again from the new state.
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          build="$PWD/dist"
          git init -q "$RUNNER_TEMP/store"
          cd "$RUNNER_TEMP/store"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            rm -rf -- *
            lease=''
            # The first preview finds no branch yet.
            if git fetch -q --depth 1 "$remote" pr-previews 2> /dev/null; then
              lease=$(git rev-parse FETCH_HEAD)
              git read-tree -u --reset FETCH_HEAD
            fi
            # The branch holds the previews of main and of the pull requests, nothing else.
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name main ! -name pull -exec rm -rf {} +
            rm -rf "$DIR"
            if [ "$ACTION" != closed ]; then
              mkdir -p "$DIR"
              cp -r "$build/." "$DIR"
            fi
            git add -A
            if [ -n "$lease" ] && [ "$(git write-tree)" = "$(git rev-parse "$lease^{tree}")" ]; then
              exit 0
            fi
            commit=$(git commit-tree "$(git write-tree)" -m "Previews of main and the open pull requests")
            if git push -q --force-with-lease="pr-previews:$lease" "$remote" "$commit:refs/heads/pr-previews"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
      # One comment per pull request; when its text changes (a new address), it is updated.
      - name: Link the preview in the pull request
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        env:
          NUMBER: ${{ github.event.number }}
        run: |
          marker='<!-- pr-preview -->'
          url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/$DIR/"
          body="$marker
          Preview of this pull request: $url
          It follows every push a few minutes later and is removed when the pull request is closed."
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id")
          id=${ids%%$'\n'*}
          if [ -z "$id" ]; then
            gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
          elif [ "$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id" --jq .body)" != "$body" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          fi
