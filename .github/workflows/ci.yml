name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its outdated run. Runs on main always finish, so that every
# merged commit gets its result (and the badge does not show a cancelled run as failing).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Check commit messages (pull requests only)
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
      - name: actionlint
        uses: raven-actions/actionlint@v2
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run lint:md
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint:knip
      - run: npm run audit
      - name: Tests with coverage threshold 100 %
        run: npm run test:coverage
      - run: npm run build

  # One job per browser, side by side.
  acceptance:
    name: acceptance (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Chrome comes with the runner image; Firefox is Playwright's own build and downloads in seconds.
      # The system packages of `--with-deps` (fonts, video codecs) are not needed by the tests, and
      # their download from the Ubuntu mirror took about a minute, at times it hung for many.
      - name: Install Firefox
        if: matrix.browser == 'firefox'
        run: npm run e2e:install
      - name: Acceptance tests (Playwright, ${{ matrix.browser }})
        run: npm run e2e -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
